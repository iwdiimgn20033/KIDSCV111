var CFG = Object.assign({}, window.KIDSCV_CONFIG || {});
CFG.SUPABASE_URL = String(CFG.SUPABASE_URL || '').replace(/[^\x21-\x7E]/g, '').replace(/\/+$/, '');

CFG.OTP_CHANNEL = String(CFG.OTP_CHANNEL || 'sms').replace(/[^a-z]/gi, '').toLowerCase();
var LOCAL = CFG.LOGIN === false; // لإيقاف شاشة الدخول اكتبي LOGIN: false في config.js
var LKEY = 'kidscv-local-v1';
var SUPA_ESM = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
var KEEP = ['gender', 'stage', 'shapes', 'data', 'photo', 'career', 'fsPct', 'fw', 'hue', 'hobbyBg', 'wa'];
var sb = null, session = null, rows = [], cur = null, mounted = false, saveTimer = null;
var ui = { phase: 'boot', user: '', pass: '', pass2: '', step: 'login', err: '', busy: false, save: '' };
var app;

class App extends Component {
  save(patch) { this.setState(patch, queueCloud); }
  renderVals() {
    var v = super.renderVals();
    var self = this;
    v.onPhoto = function (e) { photoResize(e, self); };
    return v;
  }
}
function photoResize(e, comp) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var m = 600, k = Math.min(1, m / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      comp.save({ photo: c.toDataURL('image/jpeg', 0.85) });
    };
    img.onerror = function () { comp.save({ photo: r.result }); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
function pick(st) { var o = {}; KEEP.forEach(function (k) { if (st[k] !== undefined) o[k] = st[k]; }); return o; }
function queueCloud() {
  if (LOCAL) { try { window.localStorage.setItem(LKEY, JSON.stringify(pick(app.state || {}))); } catch (e) {} return; }
  if (!cur) return;
  ui.save = 'جارٍ الحفظ…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 1200);
  schedule();
}
async function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!cur || !sb || !app) return;
  var payload = pick(app.state || {});
  var row = rows.find(function (x) { return x.id === cur; });
  if (row) row.data = payload;
  var res = await sb.rpc('kid_save', { p_token: session.token, p_id: cur, p_data: payload });
  if (res.error && /BAD_SESSION/.test(res.error.message)) return sessionExpired();
  ui.save = res.error ? 'تعذّر الحفظ، تحقّق من الاتصال' : 'تم الحفظ';
  schedule();
}
function studentState(row) { return Object.assign({ vw: window.innerWidth, user: 'main' }, (row && row.data) || {}); }
function selectRow(id) {
  cur = id;
  var row = rows.find(function (x) { return x.id === id; });
  app.state = studentState(row);
  ui.save = '';
  schedule(function () { if (!mounted) { mounted = true; app.componentDidMount(); } });
}
async function loadRows() {
  ui.phase = 'loading'; schedule();

  if (res.error) {
    if (/BAD_SESSION/.test(res.error.message)) return sessionExpired();
    ui.phase = 'error'; ui.err = 'تعذّر تحميل السير الذاتية: ' + res.error.message; schedule(); return;
  }
  rows = res.data || [];
  if (!rows.length) {
    var ins = await sb.rpc('kid_new', { p_token: session.token, p_data: { data: {} } });
    if (ins.error) { ui.phase = 'error'; ui.err = 'تعذّر إنشاء سيرة جديدة: ' + ins.error.message; schedule(); return; }
    rows = [ins.data];
  }

  if (ui.welcome) { ui.save = ui.welcome; ui.welcome = ''; schedule(); }
}
function sessionExpired() {
  clearSession(); resetAll(); ui.err = 'انتهت الجلسة، ادخل مرة أخرى.'; schedule();
}
var SKEY = 'kidscv-session-v1';
function saveSession() { try { window.localStorage.setItem(SKEY, JSON.stringify(session)); } catch (e) {} }
function clearSession() { session = null; try { window.localStorage.removeItem(SKEY); } catch (e) {} }
function readSession() { try { var v = JSON.parse(window.localStorage.getItem(SKEY) || 'null'); return v && v.token ? v : null; } catch (e) { return null; } }
async function newStudent() {
  await flushSave();

var EMAIL_DOMAIN = 'students.jordanianschoolcv.store';
function normUser(v) {
  return String(v || '').replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }).replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }).trim().toLowerCase();
}
function userEmail(u) { return u + '@' + EMAIL_DOMAIN; }
function authError(msg) {
  msg = String(msg || '');
  if (/invalid login credentials/i.test(msg)) return 'اسم المستخدم أو كلمة المرور غير صحيحة.';
  if (/already registered|already exists/i.test(msg)) return 'اسم المستخدم هذا مستخدم من قبل. اختر اسماً آخر، أو اضغط «دخول» إذا كان حسابك.';
  if (/email not confirmed/i.test(msg)) return 'الحساب يحتاج تفعيلاً. على المسؤول إيقاف خيار «Confirm email» في إعدادات Supabase.';
  if (/password/i.test(msg) && /(6|characters|short)/i.test(msg)) return 'كلمة المرور قصيرة، اكتب 6 أحرف أو أرقام على الأقل.';
  if (/signups? not allowed|signup is disabled/i.test(msg)) return 'إنشاء الحسابات موقوف في إعدادات Supabase.';
  if (/rate limit/i.test(msg)) return 'محاولات كثيرة، انتظر قليلاً ثم حاول مرة أخرى.';
  return 'حدث خطأ: ' + msg;
}
async function submitAuth() {
  if (ui.busy) return;
  var u = normUser(ui.user), p = String(ui.pass || '');
  if (!/^[a-z0-9._-]{3,30}$/.test(u)) { ui.err = 'اسم المستخدم يجب أن يكون من 3 إلى 30 حرفاً إنجليزياً أو رقماً (مثل رقم الطالب)، بدون مسافات.'; schedule(); return; }
  p = normDigits(p) || p;
  if (p.length < 4) { ui.err = 'الرمز السري يجب أن يكون 4 أرقام على الأقل.'; schedule(); return; }
  ui.busy = true; ui.err = ''; schedule();
  var res = await sb.rpc('kid_enter', { p_user: u, p_pass: p });
  ui.busy = false;
  if (res.error) {
    var m = res.error.message || '';
    ui.err = /USERNAME_TAKEN/.test(m) ? 'اسم المستخدم هذا مستخدم من قبل. اختر اسماً آخر، أو اضغط «دخول» إذا كان حسابك.'
      : /LOCKED/.test(m) ? 'محاولات خاطئة كثيرة. حاول مرة أخرى بعد 10 دقائق.'
      : /BAD_USERNAME/.test(m) ? 'اسم المستخدم يجب أن يكون من 3 إلى 30 حرفاً إنجليزياً أو رقماً، بدون مسافات.'
      : /SHORT_PASSWORD/.test(m) ? 'الرمز السري يجب أن يكون 4 أرقام على الأقل.'
      : /kid_(enter|register|login)|function|schema cache/i.test(m) ? 'قاعدة البيانات غير مجهّزة بعد: نفّذي ملف accounts-setup.sql في Supabase (SQL Editor).'
      : 'حدث خطأ: ' + m;
    schedule(); return;
  }
  if (!res.data || !res.data.token) { ui.err = 'الرمز السري غير صحيح لهذا الاسم. إذا كان هذا أول دخول لك، اختر اسماً آخر لأن هذا الاسم مستخدم من قبل.'; schedule(); return; }
  session = { token: res.data.token, user: u };
  ui.welcome = res.data.created ? 'تم إنشاء حسابك باسم «' + u + '». تذكّر الاسم والرمز للدخول في المرة القادمة.' : '';
  saveSession();
  ui.pass = ''; ui.pass2 = '';
  await loadRows();
}
